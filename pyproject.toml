[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenvault"
version = "0.1.0"
description = "Privacy-preserving PII tokenization and matching for cross-border data transfer"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Keyur Khant", email = "keyurkhant1998@gmail.com"},
]
keywords = [
    "pii", "tokenization", "privacy", "anonymization", "hashing",
    "gdpr", "pipeda", "cross-border", "data-transfer", "hmac",
    "fuzzy-matching", "aes-siv", "argon2", "compliance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage      = "https://github.com/keyurkhant/tokenvault"
Repository    = "https://github.com/keyurkhant/tokenvault"
"Bug Tracker" = "https://github.com/keyurkhant/tokenvault/issues"
Changelog     = "https://github.com/keyurkhant/tokenvault/blob/master/CHANGELOG.md"

[project.optional-dependencies]
argon2   = ["argon2-cffi>=23.1"]
aes-siv  = ["cryptography>=42.0"]
fuzzy    = ["jellyfish>=1.1"]
phone    = ["phonenumbers>=8.13"]
cli      = ["tomli>=2.0; python_version < '3.11'"]
all      = ["tokenvault[argon2,aes-siv,fuzzy,phone,cli]"]
dev      = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "tokenvault[all]",
]

[project.scripts]
tokenvault = "tokenvault.cli.commands:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict         = true

[[tool.mypy.overrides]]
# tomllib is stdlib on 3.11+, tomli is the backport for 3.10.
# The type: ignore[import-not-found] comment is needed on one version
# but flagged as unused on the other — disable that specific check here.
module = "tokenvault.cli.commands"
warn_unused_ignores = false
